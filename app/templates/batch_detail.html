{% extends "base.html" %}

{% block title %}Детали загрузки - ThoraxAI{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Хлебные крошки -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Главная</a></li>
            <li class="breadcrumb-item"><a href="/batches">Загрузки</a></li>
            <li class="breadcrumb-item active" aria-current="page">Детали загрузки</li>
        </ol>
    </nav>

    <!-- Заголовок и информация о батче -->
    <div class="row mb-4">
        <div class="col">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h2><i class="fas fa-info-circle"></i> Детали загрузки</h2>
                    <p class="text-muted" id="batchInfo">Загрузка информации...</p>
                    <p class="text-muted" id="processingTimeDisplay" style="display: none;"></p>
                </div>
                <div>
                    <button class="btn btn-success" id="downloadReportBtn" onclick="downloadReport()" style="display: none;">
                        <i class="fas fa-download"></i> Скачать отчет
                    </button>
                    <a href="/batches" class="btn btn-outline-secondary ms-2">
                        <i class="fas fa-arrow-left"></i> Назад к списку
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Статистика -->
    <div class="row mb-4" id="statsCards">
        <!-- Статистика будет загружена через JavaScript -->
    </div>

    <!-- Статус задач Celery -->
    <div class="row mb-4" id="tasksStatus" style="display: none;">
        <div class="col-12">
            <div class="card processing-status-card" style="border: 1px solid rgba(0, 0, 0, .125) !important; background-color: #1a1d20 !important;">
                <div class="card-header text-white" style="background-color: rgb(12, 93, 116) !important; border-bottom: 1px solid rgba(0, 0, 0, .125) !important;">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-tasks"></i> Статус обработки
                            <span id="taskStatusBadge" class="badge ms-2" style="background-color: rgb(8, 70, 87);"></span>
                        </h5>
                        <button class="btn btn-sm btn-outline-light" id="cancelBatchBtn" onclick="cancelBatch()" style="display: none;">
                            <i class="fas fa-times-circle"></i> Отменить
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="taskProgressBar" class="mb-3"></div>
                    <div id="tasksList"></div>
                </div>
            </div>
        </div>
    </div>

    <style>
    /* Градиент для карточки обработки */
    [data-theme="dark"] .processing-status-card {
        background: linear-gradient(135deg, #1a1a1ae8 0%, #2d2d2d 100%);
        border-color: rgb(12, 93, 116) !important;
    }

    [data-theme="light"] .processing-status-card {
        background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
        border-color: rgba(0, 0, 0, .125) !important;
    }
    </style>

    <!-- Фильтры -->
    <div class="row mb-5" id="filtersSection">
        <div class="col-md-3">
            <select class="form-select" id="statusFilter">
                <option value="">Все статусы</option>
                <option value="Success">Успешно</option>
                <option value="Failed">Ошибка</option>
                <option value="Pending">В обработке</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" id="pathologyFilter">
                <option value="">Все результаты</option>
                <option value="true">С патологией</option>
                <option value="false">Без патологии</option>
            </select>
        </div>
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="text" class="form-control" id="searchInput" placeholder="Поиск по названию файла...">
            </div>
        </div>
    </div>

    <!-- Список исследований -->
    <div id="studiesList" class="row">
        <!-- Исследования будут загружены через JavaScript -->
    </div>

    <!-- Пагинация -->
    <nav aria-label="Пагинация" class="mt-4" id="paginationSection">
        <ul class="pagination justify-content-center" id="pagination">
            <!-- Пагинация будет создана через JavaScript -->
        </ul>
    </nav>

    <!-- Загрузка -->
    <div id="loading" class="text-center py-5" style="display: none; min-height: 200px;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Загрузка...</span>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const batchId = window.location.pathname.split('/').pop();
    let currentPage = 1;
    const pageSize = 12;
    let allStudies = [];
    let filteredStudies = [];
    let batchData = null;

    const batchInfo = document.getElementById('batchInfo');
    const statsCards = document.getElementById('statsCards');
    const studiesList = document.getElementById('studiesList');
    const pagination = document.getElementById('pagination');
    const loading = document.getElementById('loading');
    const statusFilter = document.getElementById('statusFilter');
    const pathologyFilter = document.getElementById('pathologyFilter');
    const searchInput = document.getElementById('searchInput');

    let statusPolling = null;

    // Загрузка данных батча
    async function loadBatchData() {
        try {
            if (loading) loading.style.display = 'flex';

            // Загружаем информацию о батче
            const batchResponse = await fetch(`/api/v1/studies/batches`);
            if (!batchResponse.ok) {
                throw new Error('Ошибка загрузки информации о батче');
            }

            const batches = await batchResponse.json();
            batchData = batches.find(b => b.id == batchId);

            if (!batchData) {
                throw new Error('Батч не найден');
            }

            // Загружаем исследования батча
            const studiesResponse = await fetch(`/api/v1/studies/batches/${batchId}/studies`);
            if (!studiesResponse.ok) {
                throw new Error('Ошибка загрузки исследований');
            }

            allStudies = await studiesResponse.json();
            filteredStudies = [...allStudies];

            renderBatchInfo();
            renderStats();
            renderStudies();
            renderPagination();

            // Загружаем статус задач
            await loadTasksStatus();

        } catch (error) {
            console.error('Ошибка:', error);
            studiesList.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle"></i>
                        Ошибка при загрузке данных: ${error.message}
                    </div>
                </div>
            `;
        } finally {
            loading.style.display = 'none';
        }
    }

    // Загрузка статуса задач Celery
    async function loadTasksStatus() {
        try {
            const response = await fetch(`/api/v1/studies/batches/${batchId}/status`);
            if (!response.ok) return;

            const status = await response.json();

            // Показываем секцию задач только если есть задачи
            if (status.total_tasks > 0) {
                document.getElementById('tasksStatus').style.display = 'block';
                renderTasksStatus(status);
                updateProcessingTime();

                // Если обработка не завершена, скрываем лишнее (polling запускается отдельно при инициализации)
                if (status.progress_percentage < 100) {
                    // Скрываем кнопку отчета, фильтры и список исследований
                    document.getElementById('downloadReportBtn').style.display = 'none';
                    document.getElementById('filtersSection').style.display = 'none';
                    document.getElementById('studiesList').style.display = 'none';
                    document.getElementById('paginationSection').style.display = 'none';
                } else {
                    // Останавливаем polling при достижении 100%
                    stopStatusPolling();

                    // Скрываем блок "Статус обработки" при 100%
                    document.getElementById('tasksStatus').style.display = 'none';

                    // Показываем все после завершения
                    document.getElementById('downloadReportBtn').style.display = 'inline-block';
                    document.getElementById('filtersSection').style.display = 'flex';
                    document.getElementById('studiesList').style.display = 'flex';
                    document.getElementById('paginationSection').style.display = 'block';

                    // Перезагружаем данные исследований ТОЛЬКО ОДИН РАЗ
                    // Используем флаг чтобы не делать это при каждом polling
                    if (!window._dataReloaded) {
                        window._dataReloaded = true;
                        await loadBatchData();
                    }
                }
            } else {
                // Нет задач - показываем все
                document.getElementById('downloadReportBtn').style.display = 'inline-block';
                document.getElementById('filtersSection').style.display = 'flex';
                document.getElementById('studiesList').style.display = 'flex';
                document.getElementById('paginationSection').style.display = 'block';
            }

        } catch (error) {
            console.log('Could not load tasks status:', error);
            // При ошибке показываем все
            document.getElementById('downloadReportBtn').style.display = 'inline-block';
            document.getElementById('filtersSection').style.display = 'flex';
            document.getElementById('studiesList').style.display = 'flex';
            document.getElementById('paginationSection').style.display = 'block';
        }
    }

    // Обновление информации о времени обработки
    function updateProcessingTime() {
        if (!batchData) return;

        // Правильно парсим время - добавляем 'Z' чтобы JavaScript понял что это UTC
        const startTime = batchData.processing_start_time ?
            new Date(batchData.processing_start_time + 'Z') : null;

        if (startTime) {
            let endTime;
            let statusText;

            if (batchData.processing_end_time) {
                // Обработка завершена - используем реальное время окончания (тоже добавляем 'Z')
                endTime = new Date(batchData.processing_end_time + 'Z');
            } else {
                // Обработка идет - используем текущее время
                endTime = new Date();
            }

            // Вычисляем разность в секундах
            const duration = Math.floor((endTime - startTime) / 1000);

            const minutes = Math.floor(duration / 60);
            const seconds = duration % 60;
            const timeStr = minutes > 0 ? `${minutes} мин ${seconds} сек` : `${seconds} сек`;

            if (batchData.processing_end_time) {
                statusText = `Завершено за: ${timeStr}`;
            } else {
                statusText = `В обработке: ${timeStr}`;
            }

            // Отображаем под "Детали загрузки"
            const display = document.getElementById('processingTimeDisplay');
            display.textContent = statusText;
            display.style.display = 'block';
        }
    }

    // Отмена батча
    async function cancelBatch() {
        if (!confirm('Вы уверены, что хотите отменить обработку этого батча?')) {
            return;
        }

        try {
            const response = await fetch(`/api/v1/studies/batches/${batchId}/cancel`, {
                method: 'POST'
            });

            if (!response.ok) {
                throw new Error('Ошибка при отмене батча');
            }

            const result = await response.json();
            alert(result.message);

            // Обновляем данные
            location.reload();
        } catch (error) {
            console.error('Error cancelling batch:', error);
            alert('Ошибка при отмене батча: ' + error.message);
        }
    }

    // Отображение статуса задач
    function renderTasksStatus(status) {
        // Обновляем бейдж
        document.getElementById('taskStatusBadge').textContent =
            `${Math.round(status.progress_percentage)}% завершено`;

        // Показываем/скрываем кнопку отмены
        if (status.progress_percentage < 100) {
            document.getElementById('cancelBatchBtn').style.display = 'inline-block';
        } else {
            document.getElementById('cancelBatchBtn').style.display = 'none';
        }

        // Прогресс-бар (убираем полоски для 100%)
        const progressClass = status.failed_tasks > 0 ? 'bg-warning' :
                              status.progress_percentage === 100 ? 'bg-success' : '';
        // Используем rgb(209, 136, 33) вместо rgb(12, 93, 116) для прогресс-бара
        const progressStyle = status.progress_percentage === 100 ? '' : 'background-color: rgb(209, 136, 33);';
        const isAnimated = status.progress_percentage < 100;

        document.getElementById('taskProgressBar').innerHTML = `
            <div class="progress" style="height: 30px;">
                <div class="progress-bar ${isAnimated ? 'progress-bar-striped progress-bar-animated' : ''} ${progressClass}"
                     role="progressbar"
                     style="width: ${status.progress_percentage}%; ${!progressClass ? progressStyle : ''}">
                    ${Math.round(status.progress_percentage)}%
                </div>
            </div>
            <div class="row mt-3 text-center">
                <div class="col-md-3">
                    <small class="text-muted">Всего</small>
                    <div class="h5">${status.total_tasks}</div>
                </div>
                <div class="col-md-3">
                    <small class="text-muted">Ожидают</small>
                    <div class="h5 text-secondary">${status.pending_tasks}</div>
                </div>
                <div class="col-md-3">
                    <small class="text-muted">Успешно</small>
                    <div class="h5 text-success">${status.success_tasks}</div>
                </div>
                <div class="col-md-3">
                    <small class="text-muted">Ошибок</small>
                    <div class="h5 text-danger">${status.failed_tasks}</div>
                </div>
            </div>
        `;

        // Список задач (показываем только первые 10 или те, что в обработке/с ошибкой)
        const displayTasks = status.tasks
            .filter(t => t.status !== 'SUCCESS' || status.tasks.indexOf(t) < 10)
            .slice(0, 15);

        if (displayTasks.length > 0) {
            document.getElementById('tasksList').innerHTML = `
                <div class="table-responsive mt-3">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>Файл</th>
                                <th>Статус</th>
                                <th>Study ID</th>
                                <th>Ошибка</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${displayTasks.map(task => `
                                <tr>
                                    <td><small>${task.filename}</small></td>
                                    <td>${getTaskStatusBadge(task.status)}</td>
                                    <td>${task.study_id ? `<a href="/studies/${task.study_id}">${task.study_id}</a>` : '-'}</td>
                                    <td><small class="text-danger">${task.error_message || '-'}</small></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }
    }

    // Получение бейджа статуса задачи
    function getTaskStatusBadge(status) {
        const badges = {
            'PENDING': '<span class="badge bg-secondary">Ожидает</span>',
            'STARTED': '<span class="badge" style="background-color: rgb(12, 93, 116);"><i class="fas fa-sync-alt fa-spin me-1"></i>Выполняется</span>',
            'SUCCESS': '<span class="badge bg-success"><i class="fas fa-check me-1"></i>Успешно</span>',
            'FAILURE': '<span class="badge bg-danger"><i class="fas fa-times me-1"></i>Ошибка</span>',
            'RETRY': '<span class="badge bg-warning"><i class="fas fa-redo me-1"></i>Повтор</span>',
        };
        return badges[status] || `<span class="badge bg-secondary">${status}</span>`;
    }

    // Запуск polling статуса
    function startStatusPolling() {
        if (statusPolling) {
            clearInterval(statusPolling);
        }

        statusPolling = setInterval(async () => {
            try {
                // Обновляем только статус задач
                await loadTasksStatus();

                // Перезагружаем данные батча для обновления времени
                const batchResponse = await fetch(`/api/v1/studies/batches`);
                if (batchResponse.ok) {
                    const batches = await batchResponse.json();
                    const updatedBatch = batches.find(b => b.id == batchId);
                    if (updatedBatch) {
                        batchData = updatedBatch;
                    }
                }
            } catch (error) {
                console.error('Polling error:', error);
            }
        }, 3000);
    }

    // Остановка polling
    function stopStatusPolling() {
        if (statusPolling) {
            clearInterval(statusPolling);
            statusPolling = null;
        }
    }

    // Отображение информации о батче
    function renderBatchInfo() {
        // Добавляем 3 часа к времени загрузки для правильного отображения
        const uploadDate = new Date(batchData.upload_date);
        const adjustedDate = new Date(uploadDate.getTime() + 3 * 60 * 60 * 1000);
        const formattedDate = adjustedDate.toLocaleString('ru-RU');

        batchInfo.textContent = `Загружено: ${formattedDate}`;
    }

    // Отображение статистики
    function renderStats() {
        const successRate = batchData.total_studies > 0 ?
            Math.round((batchData.processed_studies / batchData.total_studies) * 100) : 0;

        statsCards.innerHTML = `
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-primary">${batchData.total_studies}</h5>
                        <p class="card-text">Исследований</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success">${batchData.processed_studies}</h5>
                        <p class="card-text">Обработано</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-danger">${batchData.failed_studies}</h5>
                        <p class="card-text">Ошибок</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-info">${successRate}%</h5>
                        <p class="card-text">Успешность</p>
                    </div>
                </div>
            </div>
        `;
    }

    // Отображение исследований (используем тот же код что и в studies.html)
    function renderStudies() {
        const startIndex = (currentPage - 1) * pageSize;
        const endIndex = startIndex + pageSize;
        const studiesToShow = filteredStudies.slice(startIndex, endIndex);

        if (studiesToShow.length === 0) {
            studiesList.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-info text-center">
                        <i class="fas fa-info-circle"></i>
                        Исследования не найдены
                    </div>
                </div>
            `;
            return;
        }

        studiesList.innerHTML = studiesToShow.map(study => createStudyCardContent(study)).join('');
    }

    // Создание содержимого карточки исследования
    function createStudyCardContent(study) {
        const statusBadge = getStatusBadge(study.processing_status);
        const pathologyBadge = getPathologyBadge(study.pathology);
        const probability = study.probability_of_pathology ? `${study.probability_of_pathology.toFixed(3)}` : 'N/A';

        return `
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="card h-100 study-card clickable-card" onclick="window.location.href='/studies/${study.id}'">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="fas fa-file-medical me-2"></i>
                            ${study.path_to_study}
                        </h6>
                        ${statusBadge}
                    </div>
                    <div class="card-body">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <div class="text-center mb-1">
                                    <small class="text-muted">Статус патологии</small>
                                </div>
                                <div class="d-flex justify-content-center">
                                    ${pathologyBadge}
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="text-center mb-1">
                                    <small class="text-muted">Вероятность</small>
                                </div>
                                <div class="text-center">
                                    <div class="h5 mb-0 text-primary fw-bold">${probability}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // Получение бейджа статуса
    function getStatusBadge(status) {
        const badges = {
            'Success': '<span class="badge bg-success"><i class="fas fa-check me-1"></i>Успешно</span>',
            'Failed': '<span class="badge bg-danger"><i class="fas fa-times me-1"></i>Ошибка</span>',
            'Pending': '<span class="badge bg-warning"><i class="fas fa-clock me-1"></i>В обработке</span>',
            'Processing': '<span class="badge bg-info"><i class="fas fa-spinner me-1"></i>Обрабатывается</span>'
        };
        return badges[status] || '<span class="badge bg-secondary">Неизвестно</span>';
    }

    // Получение бейджа патологии
    function getPathologyBadge(pathology) {
        if (pathology === true) {
            return '<span class="badge bg-danger"><i class="fas fa-exclamation-triangle me-1"></i>Есть патология</span>';
        } else if (pathology === false) {
            return '<span class="badge bg-success"><i class="fas fa-check me-1"></i>Норма</span>';
        } else {
            return '<span class="badge bg-secondary"><i class="fas fa-question me-1"></i>Неизвестно</span>';
        }
    }

    // Отображение пагинации (тот же код что и в других страницах)
    function renderPagination() {
        const totalPages = Math.ceil(filteredStudies.length / pageSize);

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let paginationHTML = '';

        paginationHTML += `
            <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>
        `;

        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                paginationHTML += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
                    </li>
                `;
            } else if (i === currentPage - 3 || i === currentPage + 3) {
                paginationHTML += '<li class="page-item disabled"><span class="page-link">...</span></li>';
            }
        }

        paginationHTML += `
            <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        `;

        pagination.innerHTML = paginationHTML;
    }

    // Смена страницы
    function changePage(page) {
        const totalPages = Math.ceil(filteredStudies.length / pageSize);
        if (page < 1 || page > totalPages) return;

        currentPage = page;
        renderStudies();
        renderPagination();

        studiesList.scrollIntoView({ behavior: 'smooth' });
    }

    // Фильтрация исследований
    function filterStudies() {
        const statusValue = statusFilter.value;
        const pathologyValue = pathologyFilter.value;
        const searchTerm = searchInput.value.toLowerCase();

        filteredStudies = allStudies.filter(study => {
            const matchesStatus = !statusValue || study.processing_status === statusValue;
            const matchesPathology = !pathologyValue ||
                (pathologyValue === 'true' && study.pathology === true) ||
                (pathologyValue === 'false' && study.pathology === false);
            const matchesSearch = !searchTerm ||
                study.path_to_study.toLowerCase().includes(searchTerm);

            return matchesStatus && matchesPathology && matchesSearch;
        });

        currentPage = 1;
        renderStudies();
        renderPagination();
    }

    // Скачивание отчета
    async function downloadReport() {
        try {
            const response = await fetch(`/api/v1/studies/batches/${batchId}/report`);
            if (!response.ok) {
                throw new Error('Ошибка при скачивании отчета');
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `batch_report_${batchId}.xlsx`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

        } catch (error) {
            alert('Ошибка при скачивании отчета: ' + error.message);
        }
    }

    // Сделаем функции глобальными
    window.changePage = changePage;
    window.downloadReport = downloadReport;

    // Обработчики событий
    statusFilter.addEventListener('change', filterStudies);
    pathologyFilter.addEventListener('change', filterStudies);
    searchInput.addEventListener('input', filterStudies);

    // Загружаем данные при загрузке страницы
    loadBatchData();

    // Проверяем статус задач и запускаем polling если нужно
    loadTasksStatus().then(() => {
        // Если есть незавершенные задачи, запускаем polling
        // (только один раз при загрузке страницы)
        const tasksStatus = document.getElementById('tasksStatus');
        if (tasksStatus.style.display !== 'none') {
            startStatusPolling();
        }
    });
});
</script>
